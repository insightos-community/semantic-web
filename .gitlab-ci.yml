# semantic-web CI：开发 PR、合入 MR、主干、发布。只做代码校验，不跑 Playwright。
# 1) 功能分支 push = 开发 PR：lint / 单测 / gitleaks / 生产构建
# 2) MR 到 develop/默认分支 = 合入门禁：再验一次（相对目标分支）
# 3) 已开 MR 时不再跑分支 push，避免双跑
# 4) E2E 只在本机跑，不进流水线
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$/'
    - when: never

stages: [validate, test, security, build, package, publish, release]

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "0"
  CHANGELOG_FILE: "CHANGELOG.md"
  PACKAGE_REGISTRY_NAME: "$CI_PROJECT_PATH_SLUG"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_registry: "https://registry.npmmirror.com"
  CI_IMAGE_NODE: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:22.22.3"
  CI_IMAGE_ALPINE: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.22"
  CI_IMAGE_RELEASE_CLI: "docker.1ms.run/registry.gitlab.com/gitlab-org/release-cli:v0.24.0"
  GITHUB_PROXY: "https://ghfast.top/"
  GITLEAKS_VERSION: "8.24.2"
  ALPINE_MIRROR: "https://mirrors.aliyun.com/alpine"

.verify_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$/'
    - when: never

.npm_cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

.node_image:
  image: $CI_IMAGE_NODE

.alpine_image:
  image: $CI_IMAGE_ALPINE

.release_cli_image:
  image: $CI_IMAGE_RELEASE_CLI

.release_tag_rules:
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$/'
    - when: never

include:
  - local: ci/verify.yml
  - local: ci/release.yml
